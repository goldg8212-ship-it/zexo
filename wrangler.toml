name = "zexo-api"
main = "worker/src/index.js"
compatibility_date = "2026-11-24"

[assets]
directory = "."
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "zexo-db"
database_id = "47999187-c376-4847-be04-7590be5832d8"
preview_database_id = "47999187-c376-4847-be04-7590be5832d8"

[[r2_buckets]]
binding = "FILES"
bucket_name = "zexo-files"
preview_bucket_name = "zexo-files-preview"

[vars]
ALLOWED_ORIGIN = "https://zexoapp18.workers.dev"
